name: Stable release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version, matching plugin.toml (for example 0.1.0)'
        required: true
      verified_on_hosts:
        description: 'Real nyx/aether and light/dark/custom theme checks completed'
        type: boolean
        required: true
        default: false
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.verified_on_hosts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          version = os.environ['RELEASE_VERSION']
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version)
          with open('nixdatifier-noctalia/plugin.toml', 'rb') as f:
              assert tomllib.load(f)['version'] == version
          PY
      - name: Build and test stable snapshot
        run: nix flake check --print-build-logs
      - name: Native plugin lint
        run: nix run github:noctalia-dev/noctalia/546ec1cd6f6ca6c93e2995043a7b89f43ff14ceb -- plugins lint ./nixdatifier-noctalia
      - name: Create immutable version branch and release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$RELEASE_VERSION" -f sha="$GITHUB_SHA"
          gh release create "v$RELEASE_VERSION" --target "$GITHUB_SHA" --title "$RELEASE_VERSION" --generate-notes
